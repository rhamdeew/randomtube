{{define "content"}}
<h1 class="title">{{t .Lang "admin.nav.categories"}}</h1>

<div class="columns">
    <div class="column is-5">
        <div class="box">
            <h2 class="subtitle">{{t $.Lang "admin.categories.add_heading"}}</h2>
            <form method="post" action="/admin/categories">
                <div class="field">
                    <label class="label is-small">{{t $.Lang "admin.common.name"}}</label>
                    <div class="control">
                        <input class="input is-small" type="text" name="name" placeholder="{{t $.Lang "admin.categories.name_placeholder"}}" required>
                    </div>
                </div>
                <div class="field">
                    <label class="label is-small">{{t $.Lang "admin.categories.code_label"}}</label>
                    <div class="control">
                        <input class="input is-small" type="text" name="code" placeholder="music" required>
                    </div>
                </div>
                <div class="field">
                    <button class="button is-primary is-small" type="submit">{{t $.Lang "admin.common.add"}}</button>
                </div>
            </form>
        </div>
    </div>
    <div class="column is-7">
        <table class="table is-fullwidth is-striped">
            <thead><tr><th>ID</th><th>{{t $.Lang "admin.common.name"}}</th><th>{{t $.Lang "admin.common.code"}}</th><th>{{t $.Lang "admin.common.actions"}}</th></tr></thead>
            <tbody>
            {{range .Categories}}
            <tr>
                <td>{{.ID}}</td>
                <td>
                    <form method="post" action="/admin/categories/{{.ID}}" style="display:flex;gap:4px">
                        <input class="input is-small" type="text" name="name" value="{{.Name}}" required>
                        <input class="input is-small" type="text" name="code" value="{{.Code}}" required>
                        <button class="button is-small is-info" type="submit">✓</button>
                    </form>
                </td>
                <td>{{.Code}}</td>
                <td>
                    <form method="post" action="/admin/categories/{{.ID}}/delete">
                        <button class="button is-small is-danger" type="submit"
                            onclick="return confirm('{{t $.Lang "admin.categories.confirm_delete"}} {{.Name}}?')">{{t $.Lang "admin.common.delete"}}</button>
                    </form>
                </td>
            </tr>
            {{end}}
            </tbody>
        </table>
    </div>
</div>
{{end}}
