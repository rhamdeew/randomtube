{{define "layout"}}<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RandomTube Admin</title>
    <link rel="stylesheet" href="/static/css/bulma.min.css?v={{assetVersion}}">
    <link rel="stylesheet" href="/static/css/admin.css?v={{assetVersion}}">
</head>
<body>
<nav class="navbar is-dark" role="navigation">
    <div class="navbar-brand">
        <a class="navbar-item has-text-weight-bold" href="/admin/">RandomTube Admin</a>
    </div>
    <div class="navbar-menu">
        <div class="navbar-start">
            <a class="navbar-item" href="/admin/">{{t .Lang "admin.nav.home"}}</a>
            <a class="navbar-item" href="/admin/videos">{{t .Lang "admin.nav.videos"}}</a>
            <a class="navbar-item" href="/admin/categories">{{t .Lang "admin.nav.categories"}}</a>
            <a class="navbar-item" href="/admin/import">{{t .Lang "admin.nav.import"}}</a>
        </div>
        <div class="navbar-end">
            <div class="navbar-item">
                <a href="/" target="_blank" class="button is-small is-light">{{t .Lang "admin.nav.site"}}</a>
            </div>
            <div class="navbar-item">
                <form action="/admin/logout" method="post">
                    <button class="button is-small is-danger">{{t .Lang "admin.nav.logout"}}</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<section class="section">
    <div class="container is-fluid">
        {{template "content" .}}
    </div>
</section>
<script src="/static/js/admin.js?v={{assetVersion}}"></script>
</body>
</html>
{{end}}
